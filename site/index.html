<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mulla — My Personal Archive</title>

  <!-- Fonts: Space Mono (Pacaembu substitute) + Noto Sans Shavian -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+Shavian&display=swap">

  <!-- Design tokens, then global styles -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (dev transformer). For production, precompile the JSX. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Optional: user-fillable image placeholders -->
  <script src="scripts/image-slot.js"></script>

  <!-- App. Order matters: Shared first (exports primitives to window), App last. -->
  <script type="text/babel" src="scripts/Shared.jsx"></script>
  <script type="text/babel" src="scripts/Header.jsx"></script>
  <script type="text/babel" src="scripts/Cover.jsx"></script>
  <script type="text/babel" src="scripts/Work.jsx"></script>
  <script type="text/babel" src="scripts/Archive.jsx"></script>
  <script type="text/babel" src="scripts/Notes.jsx"></script>
  <script type="text/babel" src="scripts/Bio.jsx"></script>
  <script type="text/babel" src="scripts/Contact.jsx"></script>
  <script type="text/babel" src="scripts/Blog.jsx"></script>
  <script type="text/babel" src="scripts/Gallery.jsx"></script>
  <script type="text/babel" src="scripts/App.jsx"></script>
</body>
</html>
