name: Sync Letterboxd

# Refreshes site/data/letterboxd.json from the RSS feed (+ TMDB posters) and commits it.
# Enable: add a repo secret TMDB_API_KEY (Settings -> Secrets and variables -> Actions),
# and make sure Actions has write permission (Settings -> Actions -> General -> Workflow permissions).
on:
  schedule:
    - cron: "0 8 * * *"   # daily ~08:00 UTC. Change to taste (e.g. "0 */6 * * *" = every 6h).
  workflow_dispatch: {}    # lets you run it on demand from the Actions tab.

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: backend
        run: npm ci

      - name: Aggregate feed
        working-directory: backend
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LETTERBOXD_USER: mulla759
        run: npm run sync

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain site/data/letterboxd.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/data/letterboxd.json
            git commit -m "chore: refresh Letterboxd feed"
            git push
          else
            echo "No changes."
          fi
